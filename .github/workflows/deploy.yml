name: Deploy API to VPS

on:
  workflow_dispatch:
  push:
    branches:
      - main

# One deploy at a time — don't let a second push race the first.
concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || 'infinia' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: "30m"
          script: |
            set -euo pipefail
            APP_DIR=/var/www/lcs2027-server
            APP_NAME=lcs2027-api
            REPO_URL=https://github.com/kol123-dev/lcs2027-server.git

            echo "==> Ensuring app directory..."
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            echo "==> Syncing origin/main..."
            # Public repo: plain HTTPS URL, no token needed.
            git init -q 2>/dev/null || true
            git remote remove origin 2>/dev/null || true
            git remote add origin "$REPO_URL"
            git fetch -q --prune origin
            git checkout -fq -B main origin/main
            git reset --hard -q origin/main

            echo "==> Bootstrapping .env (only on first deploy)..."
            # .env is git-ignored, so this never overwrites an existing one.
            if [ ! -f .env ]; then
              sed "s/^AUTH_SECRET=.*/AUTH_SECRET=$(openssl rand -base64 48 | tr -d '\n')/" .env.example > .env
              echo "    .env generated from .env.example (random AUTH_SECRET)."
              echo "    -> Review BETTER_AUTH_URL and CORS_ORIGINS in /var/www/lcs2027-server/.env"
            fi

            echo "==> Installing dependencies..."
            npm ci

            echo "==> Ensuring the MySQL database exists..."
            # Prisma cannot create the database itself; the VPS already runs
            # MySQL, so create it from the DATABASE_URL in the server .env.
            DB_RAW=$(grep -E '^DATABASE_URL=' .env | head -1 | cut -d= -f2- | tr -d '"' | tr -d "'")
            case "$DB_RAW" in
              mysql://*)
                _rest=${DB_RAW#mysql://}
                _creds=${_rest%%@*}
                _hostport=${_rest#*@}
                _hostport=${_hostport%%/*}
                _dbpart=${_rest}
                _dbpart=${_dbpart#*/}
                DB_NAME=${_dbpart%%\?*}
                case "$_hostport" in
                  *:*) DB_HOST=${_hostport%%:*}; DB_PORT=${_hostport##*:} ;;
                  *)   DB_HOST=$_hostport; DB_PORT=3306 ;;
                esac
                DB_USER=${_creds%%:*}
                DB_PASS=${_creds#*:}
                export MYSQL_PWD="$DB_PASS"
                mysql --host="$DB_HOST" --port="$DB_PORT" --user="$DB_USER" \
                  -e "CREATE DATABASE IF NOT EXISTS ${DB_NAME} CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
                echo "    ensured database '$DB_NAME' on $DB_HOST:$DB_PORT"
                ;;
              *)
                echo "    WARNING: DATABASE_URL is not mysql:// - production should use MySQL."
                echo "    Set DATABASE_URL=mysql://user:pass@localhost:3306/lcs2027 in /var/www/lcs2027-server/.env and redeploy."
                ;;
            esac

            echo "==> Syncing database schema (MySQL)..."
            # The client MUST be generated from the MySQL schema so the app can
            # talk to the production database (local dev keeps SQLite).
            npx prisma generate --schema prisma/schema.mysql.prisma
            # No tracked migration files; push keeps the schema aligned.
            npx prisma db push --schema prisma/schema.mysql.prisma --accept-data-loss

            echo "==> (Re)starting PM2 process..."
            # Fresh DB seeds itself on first boot from data/2022-results.json.
            pm2 reload "$APP_NAME" --update-env || pm2 start ecosystem.config.cjs
            pm2 save

            echo "==> Deploy complete."